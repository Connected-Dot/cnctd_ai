[package]
name = "cnctd_ai"
version = "0.1.4"
edition = "2024"
authors = ["Connected Dot Inc.", "Kyle Ebner <kyle@cnctd.world>"]
description = "AI and LLM utilities"
repository = "https://github.com/Connected-Dot/cnctd_server"
license = "MIT"
keywords = ["module"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
rmcp = { version = "0.9.0", features = [
  "client",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "transport-child-process"
] }
reqwest = "0.12.24"
anthropic-sdk = "0.1.5"
async-openai = "0.30.1"
dotenvy = "0.15.7"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"



