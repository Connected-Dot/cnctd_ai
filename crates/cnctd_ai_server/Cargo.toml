[package]
name = "cnctd_ai_server"
version = "0.1.0"
edition = "2024"
authors = ["Connected Dot Inc.", "Kyle Ebner <kyle@cnctd.world>"]
description = "AI orchestration server with SSE streaming, MCP tool execution, and dynamic entity obfuscation"
repository = "https://github.com/Connected-Dot/cnctd_ai"
license = "MIT"
keywords = ["ai", "llm", "server", "obfuscation", "mcp"]

[dependencies]
cnctd_ai = { path = "../.." }
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tower-http = { version = "0.6.8", features = ["cors"] }
dotenvy = "0.15.7"
uuid = { version = "1.21.0", features = ["v4"] }
futures = "0.3.32"
async-stream = "0.3.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
reqwest = { version = "0.12.28", features = ["json"] }
rand = "0.10.0"
regex = "1.12.3"
aho-corasick = "1.1.4"
